name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: # the X-HEEP canary starts it on the release tags it creates

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests run inside a VS Code instance, which needs a display.
      - run: xvfb-run -a npm test

  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        run: echo "ref=$(cat XHEEP_COMMIT | grep . || echo main)" >> "$GITHUB_OUTPUT"
      - id: image
        # X-HEEP tags its toolchain image v<version>, the version in core-v-mini-mcu.core; `latest` lags behind.
        run: |
          v=$(curl -fsSL "https://raw.githubusercontent.com/x-heep/x-heep/${{ steps.ref.outputs.ref }}/core-v-mini-mcu.core" | sed -n 's/^name: .*core-v-mini-mcu:\(.*\)/\1/p')
          echo "tag=v${v:?no version in core-v-mini-mcu.core}" >> "$GITHUB_OUTPUT"

  # The extension's steps for a software project, run against the pinned X-HEEP
  # in the image X-HEEP's own CI uses: clone, mcu-gen, build, Verilator model, simulation.
  e2e:
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:${{ needs.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The login shell below resets PATH (Debian's /etc/profile), so remember where node is.
      - run: npm ci && npm run compile-tests && echo "NODE=$(command -v node)" >> "$GITHUB_ENV"
      # Against the pinned X-HEEP commit, the one new projects get (latest main if none is pinned yet).
      - name: Software project end to end
        shell: bash -le {0} # login shell: the image activates conda and its tools in /etc/profile.d
        run: 'XHEEP_COMMIT=$(cat XHEEP_COMMIT) "$NODE" out/test/e2e.js "$RUNNER_TEMP/project"'

  # The same steps against X-ALP's latest main, in the image X-ALP's own CI uses (`latest`: X-ALP has no release
  # tags yet). Not required to publish: X-ALP's main moves on its own.
  e2e-xalp:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/x-heep/x-heep/x-heep-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run compile-tests && echo "NODE=$(command -v node)" >> "$GITHUB_ENV"
      - name: X-ALP software project end to end
        shell: bash -le {0}
        # X-ALP's Python requirements (those of the X-HEEP it vendors) go beyond the image's, as in X-ALP's own CI.
        run: |
          pip install -r https://raw.githubusercontent.com/x-heep/x-alp/main/hw/vendor/x-heep/util/python-requirements.txt
          RISCV_XALP=$RISCV_XHEEP XHEEP_SOC=x-alp "$NODE" out/test/e2e.js "$RUNNER_TEMP/project"

  publish:
    needs: [test, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: npx @vscode/vsce package
      - run: npx @vscode/vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
